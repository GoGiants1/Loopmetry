name: Apply Loopmetry v0.3 directly (idempotent)

on:
  push:
    branches:
      - release/loopmetry-v0.3
    paths:
      - ".github/workflows/apply-loopmetry-v0.3-direct-2.yml"
      - ".loopmetry-release/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: loopmetry-v0.3-direct-rollout
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged release branch
        uses: actions/checkout@v4
        with:
          ref: release/loopmetry-v0.3
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Reconstruct verified source snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path

          expected = "d2527b77c35add1de429842f721096915243d5201f01b692756cebcffb96ff8a"
          parts = sorted(
              path for path in Path(".loopmetry-release").glob("part-*")
              if path.is_file()
          )
          if not parts:
              raise SystemExit("no staged release parts found")

          texts = ["".join(path.read_text(encoding="ascii").split()) for path in parts]
          candidates: list[tuple[str, bytes]] = []
          diagnostics: list[str] = []

          try:
              candidates.append(("joined", base64.b64decode("".join(texts), validate=True)))
          except Exception as exc:
              diagnostics.append(f"joined={exc}")

          try:
              candidates.append(
                  (
                      "per-part",
                      b"".join(base64.b64decode(text, validate=True) for text in texts),
                  )
              )
          except Exception as exc:
              diagnostics.append(f"per-part={exc}")

          output = Path("/tmp/loopmetry-v0.3-source.tar.gz")
          for mode, payload in candidates:
              digest = hashlib.sha256(payload).hexdigest()
              print(f"candidate={mode} bytes={len(payload)} sha256={digest}")
              if digest == expected:
                  output.write_bytes(payload)
                  print(f"accepted={mode}")
                  break
          else:
              raise SystemExit(
                  "verified archive reconstruction failed: " + "; ".join(diagnostics)
              )
          PY

          echo "d2527b77c35add1de429842f721096915243d5201f01b692756cebcffb96ff8a  /tmp/loopmetry-v0.3-source.tar.gz" | sha256sum -c -
          rm -rf /tmp/loopmetry-v0.3
          mkdir -p /tmp/loopmetry-v0.3
          tar -xzf /tmp/loopmetry-v0.3-source.tar.gz -C /tmp/loopmetry-v0.3

          if [ -f /tmp/loopmetry-v0.3/pyproject.toml ]; then
            SOURCE_DIR=/tmp/loopmetry-v0.3
          else
            SOURCE_DIR="$(find /tmp/loopmetry-v0.3 -mindepth 1 -maxdepth 1 -type d | sort | head -n 1)"
          fi
          test -n "${SOURCE_DIR}"
          test -f "${SOURCE_DIR}/pyproject.toml"
          echo "${SOURCE_DIR}" > /tmp/loopmetry-source-dir

      - name: Materialize clean source on current main
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "${MAIN_SHA}" > /tmp/loopmetry-main-sha
          git switch --detach "${MAIN_SHA}"

          SOURCE_DIR="$(cat /tmp/loopmetry-source-dir)"
          rm -rf "${SOURCE_DIR}/.git"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${SOURCE_DIR}/." .

          test -f pyproject.toml
          test -f AGENTS.md
          test -d src/loopmetry
          test ! -e .loopmetry-release
          test ! -e .github/workflows/apply-loopmetry-v0.3.yml
          test ! -e .github/workflows/apply-loopmetry-v0.3-direct.yml
          test ! -e .github/workflows/apply-loopmetry-v0.3-direct-2.yml

      - name: Verify implementation
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -m unittest discover -s tests -v
          uv run loopmetry analyze examples/demo_project.jsonl --format html --output /tmp/loopmetry-report.html
          uv build

      - name: Commit and push main when changed
        id: publish
        run: |
          set -euo pipefail
          MAIN_SHA="$(cat /tmp/loopmetry-main-sha)"
          git config user.name "Loopmetry Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No source-tree changes remain to publish."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "feat: add one-command submission and cohort administration"
          git push --force-with-lease=refs/heads/main:${MAIN_SHA} origin HEAD:main
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Close temporary rollout tracking
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/1" \
            -f state=closed -f state_reason=completed >/dev/null || true
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/2" \
            -f state=closed >/dev/null || true
