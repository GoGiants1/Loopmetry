name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Sync environment
        run: uv sync --locked --all-groups
      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
      - name: Validate demo data
        run: uv run loopmetry validate examples/demo_project.jsonl
      - name: Render demo reports
        run: |
          uv run loopmetry analyze examples/demo_project.jsonl --format json --output /tmp/report.json
          uv run loopmetry analyze examples/demo_project.jsonl --format html --output /tmp/report.html
      - name: Build package
        run: uv build
