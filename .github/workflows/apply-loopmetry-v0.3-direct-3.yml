name: Apply Loopmetry v0.3 directly (robust reconstruction)

on:
  push:
    branches:
      - release/loopmetry-v0.3
    paths:
      - ".github/workflows/apply-loopmetry-v0.3-direct-3.yml"
      - ".loopmetry-release/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: loopmetry-v0.3-direct-rollout
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/loopmetry-v0.3
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Reconstruct content-addressed source archive
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import re
          from collections import defaultdict
          from pathlib import Path

          EXPECTED = "d2527b77c35add1de429842f721096915243d5201f01b692756cebcffb96ff8a"
          paths = sorted(p for p in Path(".loopmetry-release").glob("part-*") if p.is_file())
          if not paths:
              raise SystemExit("no release parts")

          def clean(path: Path) -> str:
              return "".join(path.read_text(encoding="ascii").split())

          def padded(value: str) -> str:
              return value + ("=" * (-len(value) % 4))

          texts = [clean(path) for path in paths]
          candidates: list[tuple[str, bytes]] = []

          joined = "".join(texts)
          for name, value, validate in (
              ("joined-strict", joined, True),
              ("joined-lenient", joined, False),
              ("joined-no-intermediate-padding", "".join(t.rstrip("=") for t in texts[:-1]) + texts[-1], False),
          ):
              try:
                  candidates.append((name, base64.b64decode(padded(value), validate=validate)))
              except Exception as exc:
                  print(f"candidate={name} decode_error={exc}")

          try:
              candidates.append(
                  (
                      "per-file",
                      b"".join(base64.b64decode(padded(text), validate=False) for text in texts),
                  )
              )
          except Exception as exc:
              print(f"candidate=per-file decode_error={exc}")

          groups: dict[str, list[Path]] = defaultdict(list)
          for path in paths:
              match = re.match(r"part-(\d{3})", path.name)
              if not match:
                  continue
              groups[match.group(1)].append(path)
          try:
              payload = bytearray()
              for key in sorted(groups):
                  group_text = "".join(clean(path) for path in sorted(groups[key]))
                  payload.extend(base64.b64decode(padded(group_text), validate=False))
              candidates.append(("per-numbered-group", bytes(payload)))
          except Exception as exc:
              print(f"candidate=per-numbered-group decode_error={exc}")

          seen: set[str] = set()
          for mode, payload in candidates:
              digest = hashlib.sha256(payload).hexdigest()
              if digest in seen:
                  continue
              seen.add(digest)
              print(f"candidate={mode} bytes={len(payload)} sha256={digest}")
              if digest == EXPECTED:
                  Path("/tmp/loopmetry-v0.3-source.tar.gz").write_bytes(payload)
                  print(f"accepted={mode}")
                  break
          else:
              raise SystemExit("none of the reconstruction strategies matched the expected SHA-256")
          PY

          echo "d2527b77c35add1de429842f721096915243d5201f01b692756cebcffb96ff8a  /tmp/loopmetry-v0.3-source.tar.gz" | sha256sum -c -
          rm -rf /tmp/loopmetry-v0.3
          mkdir -p /tmp/loopmetry-v0.3
          tar -xzf /tmp/loopmetry-v0.3-source.tar.gz -C /tmp/loopmetry-v0.3

          if [ -f /tmp/loopmetry-v0.3/pyproject.toml ]; then
            SOURCE_DIR=/tmp/loopmetry-v0.3
          else
            SOURCE_DIR="$(find /tmp/loopmetry-v0.3 -mindepth 1 -maxdepth 1 -type d | sort | head -n 1)"
          fi
          test -f "${SOURCE_DIR}/pyproject.toml"
          echo "${SOURCE_DIR}" > /tmp/loopmetry-source-dir

      - name: Replace temporary staging tree with product source
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "${MAIN_SHA}" > /tmp/loopmetry-main-sha
          git switch --detach "${MAIN_SHA}"
          SOURCE_DIR="$(cat /tmp/loopmetry-source-dir)"
          rm -rf "${SOURCE_DIR}/.git"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${SOURCE_DIR}/." .

          test -f AGENTS.md
          test -f pyproject.toml
          test -d src/loopmetry
          test ! -e .loopmetry-release
          find .github/workflows -maxdepth 1 -type f -name 'apply-loopmetry-v0.3*' -print -quit | grep -q . && exit 1 || true

      - name: Verify source
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --locked
          uv run python -m unittest discover -s tests -v
          uv run loopmetry analyze examples/demo_project.jsonl --format html --output /tmp/loopmetry-report.html
          uv build

      - name: Publish clean main commit
        run: |
          set -euo pipefail
          MAIN_SHA="$(cat /tmp/loopmetry-main-sha)"
          git config user.name "Loopmetry Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Loopmetry v0.3 is already materialized on main."
          else
            git commit -m "feat: add one-command submission and cohort administration"
            git push --force-with-lease=refs/heads/main:${MAIN_SHA} origin HEAD:main
          fi

      - name: Close temporary rollout records
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/1" -f state=closed -f state_reason=completed >/dev/null || true
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/2" -f state=closed >/dev/null || true
