[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopmetry"
version = "0.1.0"
description = "Local-first project evidence evaluation for AI coding workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Loopmetry contributors"}]
keywords = ["ai-agents", "coding-agents", "evaluation", "observability", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
loopmetry = "loopmetry.cli:main"

[project.urls]
Repository = "https://github.com/GoGiants1/Loopmetry"
Issues = "https://github.com/GoGiants1/Loopmetry/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = ">=0.10.0,<1"
